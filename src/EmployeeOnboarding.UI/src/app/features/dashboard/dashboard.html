<h1>Dashboard</h1>

<div class="stat-cards">
  <mat-card class="stat-card">
    <mat-card-title>{{ totalEmployees() }}</mat-card-title>
    <mat-card-subtitle>Total Employees</mat-card-subtitle>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-title>{{ recentJoiners() }}</mat-card-title>
    <mat-card-subtitle>Joined in Last 30 Days</mat-card-subtitle>
  </mat-card>

  <mat-card class="stat-card">
    <mat-card-title>{{ departments() }}</mat-card-title>
    <mat-card-subtitle>Departments</mat-card-subtitle>
  </mat-card>
</div>

<mat-card class="chart-card">
  <mat-card-header>
    <mat-card-title>Employees by Department</mat-card-title>
  </mat-card-header>
  <mat-card-content>
    <canvas #departmentChart></canvas>
  </mat-card-content>
</mat-card>
